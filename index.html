<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新房装修进度</title>
<meta name="description" content="新房装修总体进度：现在做到哪一步、下一步是什么、哪些是必须过关的检查点。">
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1E2226; --muted:#5E666E; --hair:#E3DFD6;
  --in:#D9600A; --out:#2160E0; --eq:#7A3FE0; --all:#2B3036;
  --ok:#157A3C; --warn:#A85A00; --warn-bg:#FFF4E2; --gate:#D42A2A; --gate-bg:#FDECEC;
  --chip:#F0EDE6; --today:#D42A2A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171A; --card:#1E2125; --ink:#ECEEF0; --muted:#A4ABB3; --hair:#33373D;
    --in:#FF8A3D; --out:#6B9BFF; --eq:#B394FF; --all:#D9DDE2;
    --ok:#4CC27A; --warn:#F2B04C; --warn-bg:#3A2C14; --gate:#FF6B6B; --gate-bg:#3A1C1C;
    --chip:#2A2E33; --today:#FF6B6B;
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --card:#1E2125; --ink:#ECEEF0; --muted:#A4ABB3; --hair:#33373D;
  --in:#FF8A3D; --out:#6B9BFF; --eq:#B394FF; --all:#D9DDE2;
  --ok:#4CC27A; --warn:#F2B04C; --warn-bg:#3A2C14; --gate:#FF6B6B; --gate-bg:#3A1C1C;
  --chip:#2A2E33; --today:#FF6B6B;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;line-height:1.25;margin:0 0 4px;letter-spacing:.5px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:16px;margin-bottom:12px}
.now-label{font-size:13px;color:var(--muted);margin-bottom:2px}
.now-name{font-size:21px;font-weight:700;line-height:1.35}
.now-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
@media (max-width:420px){.now-grid{grid-template-columns:1fr}}
.bar{height:10px;border-radius:6px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--ok);border-radius:6px}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.alert.warn{background:var(--warn-bg);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alert b{color:var(--warn)}
.tabs{display:flex;gap:8px;margin:18px 0 10px}
.tab{flex:1;appearance:none;border:1px solid var(--hair);background:var(--card);color:var(--ink);
  font:inherit;font-size:16px;font-weight:600;padding:10px 0;border-radius:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:4px 0 12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-line{width:18px;height:5px;border-radius:3px;display:inline-block}
.lg-dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:2.5px solid var(--muted)}
.lg-dot.done{background:var(--muted)}
.lg-dot.gate{border-radius:2px;transform:rotate(45deg);border-color:var(--gate);width:10px;height:10px}

/* ---------- 地铁图 ---------- */
.map{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:6px 0}
.row{display:grid;grid-template-columns:78px 1fr;position:relative}
.gut{grid-row:1 / span 2;position:relative;min-height:58px}
.rail{position:absolute;width:5px;border-radius:2px}
.dot{position:absolute;top:15px;width:18px;height:18px;border-radius:50%;background:var(--card);border:3px solid currentColor;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:inherit;z-index:2}
.dot.done{background:currentColor}
.dot.done::after{content:"";width:6px;height:9px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.dot.doing{background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 1.8s infinite}
.dot.doing::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--card)}
.dot.gate{border-radius:3px;transform:rotate(45deg);width:17px;height:17px}
.dot.risk{background:var(--warn);border-color:var(--warn);color:#fff}
.dot.risk::after{content:"!";color:#fff;font-size:12px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot.doing{animation:none}}
.hub{position:absolute;top:13px;left:6px;width:66px;height:22px;border-radius:11px;background:var(--all);z-index:2;
  display:flex;align-items:center;justify-content:center;color:var(--card);font-size:12px;font-weight:800}
.hub.todo{background:var(--card);border:3px solid var(--all);color:var(--all)}
.head{appearance:none;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;
  padding:10px 14px 10px 4px;display:block;width:100%}
.head:focus-visible{outline:2px solid var(--out);outline-offset:-2px;border-radius:8px}
.nm{font-weight:650;font-size:17px;line-height:1.4}
.row.done .nm{color:var(--muted);font-weight:500}
.mt{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.chips{display:inline-flex;gap:5px;flex-wrap:wrap;vertical-align:1px;margin-left:4px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.chip.doing{background:var(--ok);color:#fff}
.chip.gate{background:var(--gate-bg);color:var(--gate)}
.chip.risk{background:var(--warn-bg);color:var(--warn)}
.chip.line{color:#fff}
.wait{color:var(--gate);font-weight:600}
.more{font-size:12.5px;color:var(--muted);margin-left:2px;white-space:nowrap}
.det{padding:0 14px 14px 4px;font-size:15px}
.det[hidden]{display:none}
.det p{margin:0 0 8px}
.det h4{margin:10px 0 4px;font-size:14px;color:var(--muted);font-weight:700}
.det ul{margin:0;padding-left:20px}
.det li{margin:3px 0}
.row+.row .head{border-top:1px solid color-mix(in srgb,var(--hair) 60%,transparent)}
.row.sel{background:color-mix(in srgb,var(--chip) 60%,transparent)}

/* ---------- 时间表 ---------- */
.gwrap{background:var(--card);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.gscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gt{position:relative}
.grow{display:flex;align-items:stretch;min-height:40px;border-top:1px solid color-mix(in srgb,var(--hair) 55%,transparent)}
.glab{position:sticky;left:0;z-index:3;width:132px;flex:0 0 132px;background:var(--card);padding:6px 8px 6px 12px;
  font-size:13px;line-height:1.3;border-right:1px solid var(--hair)}
.glab small{display:block;color:var(--muted);font-size:11.5px}
.gtrack{position:relative;flex:0 0 auto}
.gbar{position:absolute;top:11px;height:18px;border-radius:5px}
.gbar.todo{opacity:.38}
.gbar.doing{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px)}
.gbar.gate{box-shadow:inset 0 0 0 2px var(--gate)}
.gms{position:absolute;top:10px;width:18px;height:18px;transform:rotate(45deg);background:var(--all)}
.ghead{display:flex;position:sticky;top:0;background:var(--card);z-index:4;border-bottom:1px solid var(--hair)}
.ghead .glab{font-weight:700;color:var(--muted);font-size:12px;display:flex;align-items:flex-end}
.gmonths{position:relative;height:44px}
.gm{position:absolute;top:6px;font-size:13px;font-weight:700;padding-left:5px;border-left:1px solid var(--hair);height:38px}
.gwk{position:absolute;top:26px;font-size:10.5px;color:var(--muted);transform:translateX(-50%)}
.gline{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--hair) 70%,transparent);pointer-events:none}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:2;pointer-events:none}
.gtoday-l{position:absolute;top:2px;font-size:11px;font-weight:700;color:var(--today);transform:translateX(4px);white-space:nowrap;z-index:5}
.gnote{font-size:13px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--hair)}
.foot{font-size:13px;color:var(--muted);margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>新房装修进度</h1>
  <p class="sub" id="sub"></p>

  <div class="card">
    <div class="now-grid">
      <div><div class="now-label">现在正在做</div><div class="now-name" id="nowName"></div></div>
      <div><div class="now-label">下一个必须过关的检查</div><div class="now-name" id="nextGate"></div></div>
    </div>
    <div style="margin-top:14px">
      <div class="now-label" id="progLabel"></div>
      <div class="bar"><i id="progBar"></i></div>
    </div>
  </div>
  <div id="alerts"></div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-map" aria-selected="true" aria-controls="v-map">地铁图</button>
    <button class="tab" role="tab" id="t-gantt" aria-selected="false" aria-controls="v-gantt">时间表</button>
  </div>

  <section id="v-map" role="tabpanel" aria-labelledby="t-map">
    <div class="legend" id="legend"></div>
    <div class="map" id="map"></div>
  </section>

  <section id="v-gantt" role="tabpanel" aria-labelledby="t-gantt" hidden>
    <div class="legend" id="legend2"></div>
    <div class="gwrap">
      <div class="gscroll"><div class="gt" id="gantt"></div></div>
      <div class="gnote" id="gnote"></div>
    </div>
  </section>

  <p class="foot">点任意一站可展开说明。<b>◆ 关卡</b>＝不检查合格不准往下做，妈妈在现场看过、拍照后才付款。日期除已完成的以外都是估算，会随现场调整。</p>
</div>

/* ============================================================ 渲染 ============================================================ */
const LINE_KEYS = ["in","out","eq"];
const X = { in:18, out:40, eq:62 };
const DOT_Y = 24;
const S = DATA.stations;
const N = S.length;
const lineVar = l => `var(--${l})`;
const STATUS_TEXT = { done:"已完成", doing:"正在做", todo:"还没开始", risk:"待确认" };

const progress = {};
LINE_KEYS.forEach(L => {
  progress[L] = 0;
  S.forEach((st, i) => {
    if ((st.line === L || st.line === "all") && (st.status === "done" || st.status === "doing")) progress[L] = i;
  });
});

function fmtUpdated(){
  document.getElementById("sub").textContent = `最后更新：${DATA.updated} · 目标：${DATA.targetText}`;
}

function summary(){
  const doing = S.filter(s => s.status === "doing").map(s => s.name);
  document.getElementById("nowName").textContent = doing.join("；") || "—";
  const gi = S.findIndex(s => s.gate && s.status !== "done");
  document.getElementById("nextGate").textContent = gi >= 0 ? S[gi].name : "—";
  const done = S.filter(s => s.status === "done").length;
  document.getElementById("progLabel").textContent = `已完成 ${done} / ${N} 步`;
  document.getElementById("progBar").style.width = Math.round(done / N * 100) + "%";
  document.getElementById("alerts").innerHTML =
    DATA.alerts.map(a => `<div class="alert warn">⚠️ ${a}</div>`).join("");
}

function legend(){
  const lines = LINE_KEYS.map(L => `<span><i class="lg-line" style="background:${lineVar(L)}"></i>${DATA.lines[L].name}</span>`).join("");
  const marks = `<span><i class="lg-dot done"></i>已完成</span><span><i class="lg-dot"></i>还没开始</span><span><i class="lg-dot gate"></i>关卡</span>`;
  document.getElementById("legend").innerHTML = lines + marks;
  document.getElementById("legend2").innerHTML = lines +
    `<span><i class="lg-line" style="background:var(--muted);opacity:.4"></i>估算</span><span><i class="lg-line" style="background:var(--today);width:3px;height:14px"></i>更新日</span>`;
}

function rails(i){
  let h = "";
  LINE_KEYS.forEach(L => {
    const x = X[L] - 2.5, c = lineVar(L), p = progress[L];
    if (i > 0)     h += `<span class="rail" style="left:${x}px;top:0;height:${DOT_Y}px;background:${c};opacity:${i <= p ? 1 : .28}"></span>`;
    if (i < N - 1) h += `<span class="rail" style="left:${x}px;top:${DOT_Y}px;bottom:0;background:${c};opacity:${i < p ? 1 : .28}"></span>`;
  });
  return h;
}

function dot(st){
  if (st.line === "all") {
    const label = st.milestone ? "终点" : (st.status === "done" ? "✓" : "");
    return `<span class="hub ${st.status === "done" ? "" : "todo"}">${label}</span>`;
  }
  const cls = ["dot", st.status, st.gate ? "gate" : ""].join(" ");
  return `<span class="${cls}" style="left:${X[st.line] - 9}px;color:${lineVar(st.line)}"></span>`;
}

function chips(st){
  let c = "";
  if (st.status === "doing") c += `<span class="chip doing">正在做</span>`;
  if (st.status === "risk")  c += `<span class="chip risk">待确认</span>`;
  if (st.gate)               c += `<span class="chip gate">◆ 关卡</span>`;
  return c ? `<span class="chips">${c}</span>` : "";
}

function detail(st){
  let h = `<p>${st.what || ""}</p>`;
  if (st.wait) h += `<p class="wait">⏸ ${st.wait}</p>`;
  if (st.mom && st.mom.length) h += `<h4>现场要看的</h4><ul>${st.mom.map(m => `<li>${m}</li>`).join("")}</ul>`;
  const ln = st.line === "all" ? "全线" : DATA.lines[st.line].name;
  h += `<p class="mt" style="margin-top:8px">${ln} · ${STATUS_TEXT[st.status]}</p>`;
  return h;
}

function renderMap(){
  const el = document.getElementById("map");
  el.innerHTML = S.map((st, i) => `
    <div class="row ${st.status}" id="st-${i}">
      <div class="gut" aria-hidden="true">${rails(i)}${dot(st)}</div>
      <button class="head" aria-expanded="false" aria-controls="det-${i}">
        <div class="nm">${st.name}${chips(st)}</div>
        <div class="mt">${st.meta || ""}${st.wait ? ` · <span class="wait">${st.wait}</span>` : ""}</div>
      </button>
      <div class="det" id="det-${i}" hidden>${detail(st)}</div>
    </div>`).join("");
  el.querySelectorAll(".head").forEach(b => b.addEventListener("click", () => {
    const d = document.getElementById(b.getAttribute("aria-controls"));
    const open = b.getAttribute("aria-expanded") === "true";
    b.setAttribute("aria-expanded", String(!open));
    d.hidden = open;
    b.parentElement.classList.toggle("sel", !open);
  }));
}

function renderGantt(){
  const DAY = 86400000, W = 7;
  const t0 = new Date("2026-10-01T00:00:00"), t1 = new Date("2027-02-21T00:00:00");
  const days = Math.round((t1 - t0) / DAY), width = days * W;
  const px = d => Math.round((new Date(d + "T00:00:00") - t0) / DAY) * W;
  const rows = S.filter(s => s.s && s.e);

  let months = "", lines = "";
  for (let d = new Date(t0); d < t1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    const x = Math.round((d - t0) / DAY) * W;
    const label = d.getMonth() === 0 ? `${d.getFullYear()}年1月` : `${d.getMonth() + 1}月`;
    months += `<span class="gm" style="left:${x}px">${label}</span>`;
    lines += `<span class="gline" style="left:${x}px;background:var(--hair)"></span>`;
  }
  for (let d = new Date(t0); d < t1; d = new Date(d.getTime() + DAY)) {
    if (d.getDay() === 1) {
      const x = Math.round((d - t0) / DAY) * W;
      lines += `<span class="gline" style="left:${x}px"></span>`;
      if (d.getDate() !== 1) months += `<span class="gwk" style="left:${x}px">${d.getDate()}</span>`;
    }
  }
  const tx = px(DATA.updated);

  let h = `<div class="ghead"><div class="glab">步骤</div><div class="gtrack gmonths" style="width:${width}px">${months}
    <span class="gtoday-l" style="left:${tx}px">更新日 ${DATA.updated.slice(5)}</span></div></div>`;
  rows.forEach(st => {
    const c = st.line === "all" ? "var(--all)" : lineVar(st.line);
    const l = px(st.s), r = px(st.e) + W;
    const bar = st.milestone
      ? `<span class="gms" style="left:${l - 2}px" title="${st.name} ${st.s}"></span>`
      : `<span class="gbar ${st.status === "done" || st.status === "doing" ? st.status : "todo"} ${st.gate ? "gate" : ""}" style="left:${l}px;width:${Math.max(r - l, W)}px;background-color:${c}" title="${st.name}：${st.s} → ${st.e}"></span>`;
    const range = st.s.slice(5).replace("-", "/") + "～" + st.e.slice(5).replace("-", "/");
    const tag = st.status === "doing" ? "正在做" : st.status === "risk" ? "待确认 · " + range : st.gate ? "◆ 关卡 · " + range : range;
    h += `<div class="grow"><div class="glab">${st.name}<small>${tag}</small></div>
      <div class="gtrack" style="width:${width}px">${lines}<span class="gtoday" style="left:${tx}px"></span>${bar}</div></div>`;
  });
  document.getElementById("gantt").innerHTML = h;
  const done = S.filter(s => s.status === "done" && !s.s).map(s => s.name).join("、");
  const tbd = S.filter(s => s.status !== "done" && !s.s).map(s => s.name).join("、");
  document.getElementById("gnote").innerHTML = `已完成（不在表内）：${done}。` + (tbd ? `时间待定（不在表内）：${tbd}。` : "") + `浅色条为估算工期；左右滑动看后面月份。`;
}

function tabs(){
  const tm = document.getElementById("t-map"), tg = document.getElementById("t-gantt");
  const vm = document.getElementById("v-map"), vg = document.getElementById("v-gantt");
  const show = g => {
    tm.setAttribute("aria-selected", String(!g)); tg.setAttribute("aria-selected", String(g));
    vm.hidden = g; vg.hidden = !g;
    if (g) {
      const sc = document.querySelector(".gscroll");
      const t0 = new Date("2026-10-01T00:00:00");
      sc.scrollLeft = Math.max(0, Math.round((new Date(DATA.updated + "T00:00:00") - t0) / 86400000) * 7 - 40);
    }
    try { localStorage.setItem("house-tab", g ? "gantt" : "map"); } catch (e) {}
  };
  tm.addEventListener("click", () => show(false));
  tg.addEventListener("click", () => show(true));
  let saved = null;
  try { saved = localStorage.getItem("house-tab"); } catch (e) {}
  if (/view=gantt/.test(location.search) || (saved === "gantt" && !/shot/.test(location.search))) show(true);
}

fmtUpdated(); summary(); legend(); renderMap(); renderGantt(); tabs();
</script>
