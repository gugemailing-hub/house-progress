<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>新房装修进度</title>
<meta name="description" content="新房装修进度：现在做到哪、谁在等谁、每一步开工前必须先完成什么。">
<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#1D2125; --muted:#5F6770; --hair:#E2DED5; --chip:#EEEBE4;
  --ok:#157A3C; --ok-bg:#E6F4EB; --doing:#1F5FD6; --doing-bg:#E7EEFC; --todo:#8A929B;
  --warn:#A85A00; --warn-bg:#FFF3DF; --stop:#C92A2A; --stop-bg:#FDECEC; --today:#C92A2A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161A; --card:#1D2024; --ink:#ECEEF0; --muted:#A3AAB2; --hair:#33373D; --chip:#2A2E33;
    --ok:#4CC27A; --ok-bg:#173022; --doing:#7AA5FF; --doing-bg:#1B2740; --todo:#7C848D;
    --warn:#F2B04C; --warn-bg:#3A2C14; --stop:#FF6B6B; --stop-bg:#3A1C1C; --today:#FF6B6B;
  }
}
:root[data-theme="dark"]{
  --bg:#14161A; --card:#1D2024; --ink:#ECEEF0; --muted:#A3AAB2; --hair:#33373D; --chip:#2A2E33;
  --ok:#4CC27A; --ok-bg:#173022; --doing:#7AA5FF; --doing-bg:#1B2740; --todo:#7C848D;
  --warn:#F2B04C; --warn-bg:#3A2C14; --stop:#FF6B6B; --stop-bg:#3A1C1C; --today:#FF6B6B;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:28px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:.3px}
h2{font-size:19px;margin:0 0 4px;font-weight:700}
h3{font-size:15px;margin:14px 0 6px;font-weight:700;color:var(--muted)}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:14px;padding:16px}
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero .k{font-size:13px;color:var(--muted);font-weight:600}
.hero .d{font-size:13px;color:var(--muted)}
.hero ul{margin:6px 0 0;padding-left:18px}
.hero li{margin:4px 0;font-size:15.5px;line-height:1.45}
.hero li b{font-weight:650}
.now{font-size:19px;line-height:1.55;margin:0 0 18px;padding:14px 16px;background:var(--card);border:1px solid var(--hair);border-radius:14px}
.now b{font-weight:700}
h2.sec{font-size:15px;color:var(--muted);font-weight:700;margin:0 0 8px}
.hero .who{font-size:18px;font-weight:700;margin-bottom:2px}
.hero li{list-style:none}
.hero ul{padding-left:0}
.hero .dt{display:inline-block;min-width:78px;margin-right:8px;font-size:13px;font-weight:700;color:var(--doing);white-space:nowrap}
.hero li{display:flex;align-items:baseline}
.notes{margin:0 0 22px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-bg);border-radius:12px;padding:0 14px}
.notes summary{cursor:pointer;padding:11px 0;font-weight:700;font-size:15.5px;color:var(--warn)}
.notes ol{margin:0;padding:0 0 12px 22px}
.notes li{margin:6px 0;font-size:15px;line-height:1.5}
.prog{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.bar{flex:1;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.alert{border-radius:12px;padding:11px 14px;margin-bottom:8px;font-size:15px;line-height:1.5}
.alert.stop{background:var(--stop-bg);border:1px solid color-mix(in srgb,var(--stop) 35%,transparent)}
.alert.warn{background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.stop b{color:var(--stop)} .alert.warn b{color:var(--warn)}
.tabs{display:flex;gap:8px;margin:18px 0 12px;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0}
.tab{flex:1;appearance:none;border:1px solid var(--hair);background:var(--card);color:var(--ink);
  font:inherit;font-size:15px;font-weight:600;padding:10px 4px;border-radius:10px;cursor:pointer;line-height:1.25}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.btn:focus-visible,.glab:focus-visible,.pick:focus-visible{outline:2px solid var(--doing);outline-offset:2px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.pill.done{background:var(--ok-bg);color:var(--ok)} .pill.doing{background:var(--doing-bg);color:var(--doing)}
.pill.todo{background:var(--chip);color:var(--muted)} .pill.risk{background:var(--warn-bg);color:var(--warn)}
.pill.stop{background:var(--stop-bg);color:var(--stop)} .pill.gate{background:var(--stop-bg);color:var(--stop)}

/* ---- 交接表 ---- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--hair);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--hair);line-height:1.45}
th{border-top:0;font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--chip) 50%,var(--card))}
td.who{font-weight:650;white-space:nowrap}
td .tbd{color:var(--stop);font-weight:650}
tr.hot td{background:color-mix(in srgb,var(--stop-bg) 55%,transparent)}

/* ---- 时间表 ---- */
.gbar-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:0 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);flex:1}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:10px;border-radius:3px;display:inline-block}
.btn{appearance:none;border:1px solid var(--hair);background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.gwrap{background:var(--card);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.gscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.gbody{position:relative}
.grow{display:flex;align-items:stretch;min-height:44px;border-top:1px solid color-mix(in srgb,var(--hair) 60%,transparent)}
.glab{position:sticky;left:0;z-index:5;flex:0 0 var(--lab);width:var(--lab);background:var(--card);padding:6px 8px 6px 12px;
  font:inherit;font-size:14px;line-height:1.3;border:0;border-right:1px solid var(--hair);text-align:left;color:inherit;cursor:pointer}
.glab small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.glab .lock{color:var(--stop);font-weight:700}
.gtrack{position:relative;flex:0 0 auto}
.ghead{display:flex;position:sticky;top:0;background:var(--card);z-index:7;border-bottom:1px solid var(--hair)}
.ghead .glab{cursor:default;font-weight:700;color:var(--muted);font-size:12.5px;display:flex;align-items:flex-end}
.gmonths{position:relative;height:46px}
.gm{position:absolute;top:6px;font-size:13.5px;font-weight:700;padding-left:6px;border-left:1px solid var(--hair);height:40px;white-space:nowrap}
.gwk{position:absolute;top:27px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
.gline{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--hair) 60%,transparent);pointer-events:none}
.gline.m{background:var(--hair)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:2;pointer-events:none}
.gcny{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--warn);z-index:2;pointer-events:none}
.gflag{position:absolute;top:2px;font-size:11px;font-weight:700;transform:translateX(4px);white-space:nowrap;z-index:6}
.ggrp{background:color-mix(in srgb,var(--chip) 70%,var(--card));min-height:36px}
.ggrp .glab{background:color-mix(in srgb,var(--chip) 70%,var(--card));font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;min-width:0}
.ggrp .glab small{display:inline;margin:0;font-weight:500}
.ggrp .caret{display:inline-block;transition:transform .15s;font-size:11px;color:var(--muted)}
.ggrp[data-open="false"] .caret{transform:rotate(-90deg)}
.gb{position:absolute;top:12px;height:20px;border-radius:5px;min-width:6px}
.gb.done{background:var(--ok);opacity:.55}
.gb.doing{background:var(--doing);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.3) 0 6px,transparent 6px 12px)}
.gb.todo{background:var(--todo);opacity:.55}
.gb.risk{background:var(--warn)}
.gb.gate{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--stop)}
.gbl{position:absolute;top:12px;height:20px;line-height:20px;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:6px;pointer-events:none}
.gtbd{position:absolute;top:11px;font-size:12px;color:var(--muted);border:1px dashed var(--todo);border-radius:5px;padding:1px 8px;white-space:nowrap}
.grow.sel .glab,.grow.sel{background:color-mix(in srgb,var(--doing-bg) 80%,var(--card))}
.grow.pre .glab{box-shadow:inset 4px 0 0 var(--warn)}
.grow.pre.ok .glab{box-shadow:inset 4px 0 0 var(--ok)}
.grow.nxt .glab{box-shadow:inset 4px 0 0 var(--doing)}
.gbody.focus .grow.step:not(.sel):not(.pre):not(.nxt){opacity:.32}
.garrows{position:absolute;top:0;left:0;pointer-events:none;z-index:4}
.gdet{position:relative;z-index:5;border-top:1px solid var(--hair);background:color-mix(in srgb,var(--doing-bg) 45%,var(--card))}
.gdet>div{position:sticky;left:0;padding:12px 14px 14px;font-size:15px}
.gnote{font-size:13px;color:var(--muted);padding:10px 12px;border-top:1px solid var(--hair)}

/* ---- 详情 / 检查 ---- */
.verdict{border-radius:10px;padding:9px 12px;font-weight:650;margin-bottom:10px;font-size:15.5px}
.verdict.go{background:var(--ok-bg);color:var(--ok)} .verdict.no{background:var(--stop-bg);color:var(--stop)}
.verdict.wait{background:var(--warn-bg);color:var(--warn)}
.cl{list-style:none;margin:0;padding:0}
.cl li{padding:4px 0 4px 26px;position:relative;line-height:1.45}
.cl li::before{position:absolute;left:0;top:4px;width:18px;height:18px;border-radius:50%;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.cl li.y::before{content:"✓";background:var(--ok-bg);color:var(--ok)}
.cl li.n::before{content:"✕";background:var(--stop-bg);color:var(--stop)}
.cl li.q::before{content:"?";background:var(--warn-bg);color:var(--warn)}
.cl li small{color:var(--muted)}
.det p{margin:0 0 8px}
.det ul.plain{margin:0;padding-left:20px} .det ul.plain li{margin:3px 0}
.picks{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
@media (max-width:820px){.picks{grid-template-columns:1fr}}
.pickcol{display:flex;flex-direction:column;gap:6px}
.pickg{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:8px}
.pick{appearance:none;text-align:left;border:1px solid var(--hair);background:var(--card);color:var(--ink);font:inherit;font-size:14.5px;padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* ---- 踩坑 ---- */
.pits{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.pit h4{margin:0 0 6px;font-size:16px;line-height:1.4}
.pit .no{color:var(--muted);font-weight:700;margin-right:6px}
.pit p{margin:0 0 6px;font-size:14.5px}
.pit .next{color:var(--ok);font-weight:600}
.fig{margin:8px 0 4px;border:1px solid var(--hair);border-radius:10px;padding:6px;background:color-mix(in srgb,var(--chip) 40%,var(--card))}
.fig svg{display:block;width:100%;height:auto}
.fig text{font:12px -apple-system,"PingFang SC",sans-serif;fill:var(--ink)}
.fig .mut{fill:var(--muted)} .fig .good{fill:var(--ok);font-weight:700} .fig .bad{fill:var(--stop);font-weight:700}
.foot{font-size:13px;color:var(--muted);margin-top:18px;line-height:1.6}
section[hidden]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>新房装修进度</h1>
  <p class="sub" id="sub"></p>

  <p class="now" id="now"></p>
  <h2 class="sec">这周谁做什么</h2>
  <div class="hero" id="hero"></div>
  <details class="notes" id="notes"></details>
  <h2 class="sec">想看细一点，点下面四个按钮</h2>

  <div class="tabs" role="tablist" style="margin-top:8px">
    <button class="tab" role="tab" data-v="coord">各家安排</button>
    <button class="tab" role="tab" data-v="gantt">时间表</button>
    <button class="tab" role="tab" data-v="check">能开工吗</button>
    <button class="tab" role="tab" data-v="pits">踩过的坑</button>
  </div>

  <section id="v-coord" role="tabpanel">
    <h2>各家什么时候来，最晚不能晚于哪天</h2>
    <p class="hint">一行是一家要做的一件事。红字「还没问到」的，是儿子要去问的。</p>
    <div class="tblwrap"><table id="coord"></table></div>
  </section>

  <section id="v-gantt" role="tabpanel" hidden>
    <div class="gbar-top">
      <div class="legend" id="legend"></div>
      <button class="btn" id="zFit">看全部</button>
      <button class="btn" id="zBig">放大</button>
    </div>
    <p class="hint">一行是一道工序，横条是它做的那几天。<b>点一行</b>，能看到它要等谁先做完。🔒＝前面的还没做完，先别让这一家进场。</p>
    <div class="gwrap">
      <div class="gscroll" id="gscroll"><div id="gantt"></div></div>
      <div class="gnote" id="gnote"></div>
    </div>
  </section>

  <section id="v-check" role="tabpanel" hidden>
    <h2>师傅催着要进场？先在这里查能不能开工</h2>
    <p class="hint">点左边一道工序，右边会告诉你：它前面的事做完没有。有一项没做完，就先别让师傅进场。</p>
    <div class="picks">
      <div class="pickcol" id="picks"></div>
      <div class="card det" id="checkOut"></div>
    </div>
  </section>

  <section id="v-pits" role="tabpanel" hidden>
    <h2>踩过的坑</h2>
    <p class="hint">已经吃过的亏，记下来，后面别再犯。绿字是下次该怎么做。</p>
    <div class="pits" id="pits"></div>
  </section>

  <p class="foot"><b>关卡</b>＝不检查合格不准往下做，妈妈在现场看过、拍照后才付款。除已完成的以外，日期都是估算，各家给出准确日期后会更新。</p>
</div>

<script>
/* ============================================================
   数据区：以后更新进度只改这里（DATA）。
   steps.status: done 已完成 / doing 正在做 / todo 还没开始 / risk 待确认
   steps.g:      所属大块（groups 里的 id）
   steps.s / e:  计划起止（估算）；不写就显示「日期待排」
   steps.pre:    开工前必须完成的工序 id（用于🔒提醒和连线）
   steps.need:   不在表里的其它前置条件（文字）
   steps.pit:    相关的踩坑编号（pits 里的 id）
   ============================================================ */
const DATA = {
  updated: "2026-11-14",
  now: "现在：<b>吊顶做完了</b>，等妈妈验收；<b>外墙</b>在修补，大约 11 月 24 日开始喷漆；<b>推拉门门框</b> 11 月 20 日（周五）送到、开始装。",
  range: ["2026-11-01", "2027-02-14"],
  cny: "2027-02-06",
  hero: [
    { who:"工地上这周有谁", items:[
      { d:"每天",        t:"外墙队修补、批砂浆、贴铝条，做到 11 月 24 日左右" },
      { d:"11/20 周五",  t:"门窗厂送推拉门门框来，开始装" },
      { d:"11/24 前后",  t:"外墙队开始喷漆（门框要先装完）" } ] },
    { who:"妈妈要做（在工地）", items:[
      { d:"11/15 周日",  t:"<b>验收吊顶</b>，合格再付尾款" },
      { d:"11/15 周日",  t:"量 4 个卫生间外墙排风孔有多大，拍照" },
      { d:"11/20 周五",  t:"收门框：数够 6 樘，装之前对好高度" },
      { d:"喷漆前",      t:"和外墙队把「不喷、留着贴砖」的地方画线、拍照" } ] },
    { who:"儿子要做（在深圳）", items:[
      { d:"这两天",      t:"<b>大砖下单</b>，问清几天到货" },
      { d:"这两天",      t:"问门窗厂：6 樘门框几天装完" },
      { d:"这两天",      t:"问外墙队：哪天开喷、哪天喷完、哪天拆架子" },
      { d:"本周",        t:"和泥工商量：卫生间、厨房能不能先做防水、贴砖" } ] }
  ],
  notesTitle: "要留心的 4 件事（点开看）",
  notes: [
    "<b>春节前可能住不进去。</b>现在约好防水、贴砖都等外墙做完，外墙漆估计喷到 12 月下旬。想快一点：卫生间、厨房在屋里，可以和外墙同时做，要先和泥工商量。",
    "<b>吊顶已经先做了。</b>厨房、卫生间贴墙砖要顶到吊顶下沿；楼上放水试漏那两天，要有人盯着楼下天花板。",
    "<b>喷漆前要办完三件小事。</b>一楼风管机的外墙孔、卫生间排风孔够不够大、窗边和空调孔的防水谁来做。喷完再动会留下补漆印。",
    "<b>阳台、露台防水坎的顶面不喷漆。</b>留着等防水做完再贴砖；女儿墙照常喷。"
  ],
  coord: [
    { hot:true, who:"推拉门厂家", what:"阳台、露台 6 樘推拉门的门框到货并装好", when:"11 月 20 日（下周五）运到并开始装；几天装完<span class='tbd'>还没问到</span>", before:"外墙开喷前，约 11 月 24 日", blocks:"外墙队喷漆、防水队进场", st:"todo", chase:"儿子问几天装完；妈妈当天收货、对高度" },
    { who:"吊顶队", what:"吊顶完工，等验收", when:"11 月 15 日妈妈验收", before:"付尾款之前", blocks:"泥工贴砖、油漆", st:"doing", chase:"妈妈现场验收，合格再付款" },
    { who:"外墙队", what:"修补空鼓、批抗裂砂浆、贴分格铝条", when:"约 11 月 24 日做完（估）", before:"喷漆前", blocks:"喷外墙漆", st:"doing", chase:"妈妈拍每天进度" },

/* ============================================================ 渲染 ============================================================ */
const S = DATA.steps, BY = Object.fromEntries(S.map(s => [s.id, s]));
const G = Object.fromEntries(DATA.groups.map(g => [g.id, g]));
const PIT = Object.fromEntries(DATA.pits.map(p => [p.id, p]));
const ST = { done:"做完了", doing:"正在做", todo:"还没开始", risk:"还没定" };
const DAY = 86400000;
const D = s => new Date(s + "T00:00:00");
const md = s => { const d = D(s); return (d.getMonth() + 1) + "/" + d.getDate(); };
const unmet = st => (st.pre || []).map(i => BY[i]).filter(p => p.status !== "done");
const nexts = st => S.filter(x => (x.pre || []).includes(st.id));
const rangeText = st => st.s ? (st.s === st.e ? md(st.s) : md(st.s) + "–" + md(st.e)) : "";

function header(){
  const u = D(DATA.updated);
  document.getElementById("sub").textContent = `${u.getMonth() + 1} 月 ${u.getDate()} 日更新`;
  document.getElementById("now").innerHTML = DATA.now;
  document.getElementById("hero").innerHTML = DATA.hero.map(h =>
    `<div class="card"><div class="who">${h.who}</div><ul>${h.items.map(i => `<li><span class="dt">${i.d}</span><span>${i.t}</span></li>`).join("")}</ul></div>`).join("");
  document.getElementById("notes").innerHTML = `<summary>${DATA.notesTitle}</summary><ol>${DATA.notes.map(n => `<li>${n}</li>`).join("")}</ol>`;
}

function coord(){
  const head = ["谁", "要做什么", "什么时候", "必须赶在什么之前", "状态"];
  document.getElementById("coord").innerHTML =
    `<thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>` +
    DATA.coord.map(c => `<tr class="${c.hot ? "hot" : ""}"><td class="who">${c.who}</td><td>${c.what}</td><td>${c.when}</td><td>${c.before}</td><td><span class="pill ${c.st}">${ST[c.st]}</span></td></tr>`).join("") + "</tbody>";
}

function detail(st){
  const um = unmet(st), needs = st.need || [];
  let v;
  if (st.status === "done") v = `<div class="verdict go">这一步已经做完了</div>`;
  else if (um.length) v = `<div class="verdict no">⛔ 先别让这一家进场：前面还有 ${um.length} 件事没做完</div>`;
  else if (needs.length || st.status === "risk") v = `<div class="verdict wait">前面的工序都做完了，但还有事要先问清楚</div>`;
  else v = `<div class="verdict go">✅ 前面的事都做完了，可以开工</div>`;
  let h = v + `<p><b>${st.name}</b> <span class="pill ${st.status}">${ST[st.status]}</span>${st.gate ? ` <span class="pill gate">关卡</span>` : ""}<br><small style="color:var(--muted)">${G[st.g].name} · ${G[st.g].who}${st.s ? " · " + rangeText(st) : ""} · ${st.meta || ""}</small></p><p>${st.what || ""}</p>`;
  if ((st.pre || []).length || needs.length) {
    h += `<h3>开工前，这些要先做完</h3><ul class="cl">` +
      (st.pre || []).map(i => { const p = BY[i]; return `<li class="${p.status === "done" ? "y" : "n"}">${p.name} <small>${ST[p.status]}${p.s ? " · " + rangeText(p) : ""}</small></li>`; }).join("") +
      needs.map(n => `<li class="q">${n}</li>`).join("") + `</ul>`;
  }
  const nx = nexts(st);
  if (nx.length) h += `<h3>它不做完，这些就开不了工</h3><ul class="plain">${nx.map(n => `<li>${n.name}</li>`).join("")}</ul>`;
  if (st.mom && st.mom.length) h += `<h3>现场要看的</h3><ul class="plain">${st.mom.map(m => `<li>${m}</li>`).join("")}</ul>`;
  if (st.pit && st.pit.length) h += `<h3>以前踩过的坑</h3><ul class="plain">${st.pit.map(i => `<li>${PIT[i].t}。<span style="color:var(--ok)">${PIT[i].next}</span></li>`).join("")}</ul>`;
  return h;
}

/* ---------------- 时间表 ---------------- */
let zoom = null, selId = null;
const closed = new Set();
function renderGantt(){
  const sc = document.getElementById("gscroll");
  const cw = sc.clientWidth; if (!cw) return;
  const LAB = cw < 700 ? 150 : 270;
  const t0 = D(DATA.range[0]), t1 = D(DATA.range[1]);
  const days = Math.round((t1 - t0) / DAY);
  const fitW = (cw - LAB - 2) / days;
  if (zoom === null) zoom = cw >= 900 ? "fit" : "big";
  const W = zoom === "fit" ? fitW : Math.max(13, fitW * 1.8);
  const width = Math.round(days * W);
  const px = d => Math.round((D(d) - t0) / DAY * W);
  const clamp = x => Math.max(0, Math.min(width, x));
  document.getElementById("zFit").setAttribute("aria-pressed", String(zoom === "fit"));
  document.getElementById("zBig").setAttribute("aria-pressed", String(zoom === "big"));

  let months = "", lines = "";
  for (let d = new Date(t0); d < t1; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) {
    const x = Math.round((d - t0) / DAY * W);
    months += `<span class="gm" style="left:${x}px">${d.getMonth() === 0 ? d.getFullYear() + " 年 1 月" : (d.getMonth() + 1) + " 月"}</span>`;
    lines += `<span class="gline m" style="left:${x}px"></span>`;
  }
  for (let d = new Date(t0); d < t1; d = new Date(d.getTime() + DAY)) {
    if (d.getDay() === 1) {
      const x = Math.round((d - t0) / DAY * W);
      lines += `<span class="gline" style="left:${x}px"></span>`;
      if (d.getDate() > 3 && W >= 5) months += `<span class="gwk" style="left:${x}px">${d.getDate()}</span>`;
    }
  }
  const tx = px(DATA.updated), cx = px(DATA.cny);
  const marks = `<span class="gtoday" style="left:${tx}px"></span><span class="gcny" style="left:${cx}px"></span>`;

  let h = `<div class="ghead"><div class="glab">工序（点一行看它要等谁）</div><div class="gtrack gmonths" style="width:${width}px">${months}
    <span class="gflag" style="left:${tx}px;color:var(--today)">今天 ${md(DATA.updated)}</span>
    <span class="gflag" style="left:${cx}px;color:var(--warn);top:26px">春节 ${md(DATA.cny)}</span></div></div><div class="gbody" id="gbody">`;
  DATA.groups.forEach(g => {
    const rows = S.filter(s => s.g === g.id), dn = rows.filter(s => s.status === "done").length, open = !closed.has(g.id);
    h += `<div class="grow ggrp" data-open="${open}"><button class="glab" data-g="${g.id}" aria-expanded="${open}"><span class="caret">▼</span>${g.name}<small>${g.who} · ${dn}/${rows.length}</small></button><div class="gtrack" style="width:${width}px"></div></div>`;
    if (!open) return;
    rows.forEach(st => {
      const um = st.status !== "done" ? unmet(st) : [];
      let bar;
      if (st.s) {
        const l = clamp(px(st.s)), r = clamp(px(st.e) + W), w = Math.max(r - l, 6);
        bar = `<span class="gb ${st.status} ${st.gate ? "gate" : ""}" style="left:${l}px;width:${w}px"></span><span class="gbl" style="left:${l + w}px">${rangeText(st)}</span>`;
      } else if (st.status === "done") {
        bar = `<span class="gbl" style="left:4px">✓ ${st.meta}</span>`;
      } else {
        bar = `<span class="gtbd" style="left:${Math.min(tx + 10, width - 90)}px">日期待排</span>`;
      }
      const tag = st.status === "done" ? "做完了" : (um.length ? `<span class="lock">🔒 要先等 ${um.length} 件事</span>` : ST[st.status]) + (st.gate ? " · 关卡" : "");
      h += `<div class="grow step" data-id="${st.id}"><button class="glab" data-id="${st.id}" aria-expanded="false">${st.name}<small>${tag}</small></button>
        <div class="gtrack" style="width:${width}px">${lines}${marks}${bar}</div></div>`;
    });
  });
  h += `<svg class="garrows" id="garrows"></svg></div>`;
  const el = document.getElementById("gantt");
  el.style.setProperty("--lab", LAB + "px");
  el.innerHTML = h;
  document.getElementById("gnote").textContent = "实心条＝已有日期（除已完成的都是估算）；虚线框＝还排不出日期；红框＝关卡。" + (zoom === "big" ? "左右滑动看后面的月份。" : "");
  el.querySelectorAll(".ggrp .glab").forEach(b => b.addEventListener("click", () => {
    const g = b.dataset.g; closed.has(g) ? closed.delete(g) : closed.add(g); renderGantt();
  }));
  el.querySelectorAll(".step .glab").forEach(b => b.addEventListener("click", () => {
    selId = selId === b.dataset.id ? null : b.dataset.id; applySel(px, W, LAB, cw);
  }));
  applySel(px, W, LAB, cw);
  if (zoom === "big" && !selId) sc.scrollLeft = Math.max(0, tx - 40);
}

function applySel(px, W, LAB, cw){
  const body = document.getElementById("gbody"), svg = document.getElementById("garrows");
  body.querySelectorAll(".gdet").forEach(n => n.remove());
  body.querySelectorAll(".step").forEach(r => { r.classList.remove("sel", "pre", "ok", "nxt"); r.querySelector(".glab").setAttribute("aria-expanded", "false"); });
  svg.innerHTML = ""; body.classList.toggle("focus", !!selId);
  if (!selId) return;
  const st = BY[selId], row = body.querySelector(`.step[data-id="${selId}"]`);
  if (!row) { selId = null; body.classList.remove("focus"); return; }
  row.classList.add("sel"); row.querySelector(".glab").setAttribute("aria-expanded", "true");
  (st.pre || []).forEach(i => { const r = body.querySelector(`.step[data-id="${i}"]`); if (r) { r.classList.add("pre"); if (BY[i].status === "done") r.classList.add("ok"); } });
  nexts(st).forEach(n => { const r = body.querySelector(`.step[data-id="${n.id}"]`); if (r) r.classList.add("nxt"); });
  const det = document.createElement("div");
  det.className = "gdet"; det.innerHTML = `<div class="det" style="width:${cw}px">${detail(st)}</div>`;
  row.after(det);
  // 连线
  svg.setAttribute("width", body.scrollWidth); svg.setAttribute("height", body.scrollHeight);
  const y = id => { const r = body.querySelector(`.step[data-id="${id}"]`); return r ? r.offsetTop + 22 : null; };
  const link = (a, b, color) => {
    if (!a.s || !b.s) return "";
    const y1 = y(a.id), y2 = y(b.id); if (y1 === null || y2 === null) return "";
    const x1 = LAB + Math.max(0, px(a.e) + W), x2 = LAB + Math.max(0, px(b.s));
    const mx = Math.max(x1 + 8, x2 - 10);
    return `<path d="M${x1} ${y1} H${mx} V${y2} H${x2 - 1}" fill="none" stroke="${color}" stroke-width="2"/><path d="M${x2} ${y2} l-7 -4 v8 z" fill="${color}"/>`;
  };
  let p = "";
  (st.pre || []).forEach(i => p += link(BY[i], st, BY[i].status === "done" ? "var(--ok)" : "var(--warn)"));
  nexts(st).forEach(n => p += link(st, n, "var(--doing)"));
  svg.innerHTML = p;
}

/* ---------------- 开工前检查 ---------------- */
function check(){
  const el = document.getElementById("picks"), out = document.getElementById("checkOut");
  let h = "";
  DATA.groups.forEach(g => {
    const rows = S.filter(s => s.g === g.id && s.status !== "done");
    if (!rows.length) return;
    h += `<div class="pickg">${g.name}</div>` + rows.map(st => {
      const um = unmet(st).length;
      const p = um ? `<span class="pill stop">等 ${um} 项</span>` : (st.status === "risk" || (st.need || []).length ? `<span class="pill risk">还没定</span>` : `<span class="pill done">可开工</span>`);
      return `<button class="pick" data-id="${st.id}" aria-pressed="false"><span>${st.name}</span>${p}</button>`;
    }).join("");
  });
  el.innerHTML = h;
  const show = id => {
    el.querySelectorAll(".pick").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
    out.innerHTML = detail(BY[id]);
  };
  el.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => {
    show(b.dataset.id);
    if (window.innerWidth <= 820) out.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
  show("wq5");
}

}

    `<span><i class="sw" style="box-shadow:0 0 0 2px var(--stop);background:transparent"></i>关卡</span>` +

function tabs(){
  const btns = [...document.querySelectorAll(".tab")];
  const show = v => {
    btns.forEach(b => b.setAttribute("aria-selected", String(b.dataset.v === v)));
    ["coord", "gantt", "check", "pits"].forEach(k => document.getElementById("v-" + k).hidden = k !== v);
    if (v === "gantt") renderGantt();
    try { localStorage.setItem("house-tab2", v); } catch (e) {}
  };
  btns.forEach(b => b.addEventListener("click", () => show(b.dataset.v)));
  let saved = null;
  try { saved = localStorage.getItem("house-tab2"); } catch (e) {}
  const q = (location.search.match(/view=(\w+)/) || [])[1];
  show(["coord", "gantt", "check", "pits"].includes(q) ? q : (["coord", "gantt", "check", "pits"].includes(saved) ? saved : "coord"));
  document.getElementById("zFit").addEventListener("click", () => { zoom = "fit"; renderGantt(); });
  document.getElementById("zBig").addEventListener("click", () => { zoom = "big"; renderGantt(); });
  let t; window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => { if (!document.getElementById("v-gantt").hidden) renderGantt(); }, 150); });
